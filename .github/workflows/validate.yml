name: Validación analítica

on:
  push:
  pull_request:

jobs:
  data-and-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: peso_pulso
          POSTGRES_USER: peso_pulso
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U peso_pulso -d peso_pulso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5433
      PGDATABASE: peso_pulso
      PGUSER: peso_pulso
      PGPASSWORD: ${{ github.run_id }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m peso_pulso analyze
      - run: python -m peso_pulso render
      - run: python -m peso_pulso powerbi
      - run: python -m peso_pulso load
      - run: python -m peso_pulso verify
      - run: python tools/validate_powerbi.py
