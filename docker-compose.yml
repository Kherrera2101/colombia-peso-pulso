services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: peso_pulso
      POSTGRES_USER: peso_pulso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peso_pulso -d peso_pulso"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
